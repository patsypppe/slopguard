name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests benchmarks/compare.py benchmarks/realworld.py
      - name: Test
        run: pytest -q
      - name: Scan this repository with itself
        run: slopguard scan . --no-network
      - name: Benchmark gate
        run: slopguard bench --min-precision 0.85

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and check the distribution
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
      - name: Install the wheel in a clean environment and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/slopguard --version
          /tmp/clean/bin/slopguard rules > /dev/null
          /tmp/clean/bin/slopguard scan examples/vulnerable_agent --no-network --fail-on none
