name: Bug report
description: Something crashed, hung, or behaved wrongly (not a false positive or a miss)
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and configuration
      description: The exact command, and your `slopguard.toml` if you have one.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or traceback
      render: text
  - type: input
    id: version
    attributes:
      label: slopguard version
      description: Output of `slopguard --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python and operating system
      placeholder: "Python 3.12, Ubuntu 24.04"
    validations:
      required: true
