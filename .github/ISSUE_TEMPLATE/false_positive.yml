name: False positive
description: slopguard reported a problem that is not a problem
labels: ["false-positive"]
body:
  - type: markdown
    attributes:
      value: |
        False positives are the most useful reports. Every confirmed one becomes a regression test.
        **Please do not paste secrets or proprietary code.** Reduce it to a small made-up example.
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: "LLM-02"
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Smallest code that triggers it
      description: Just enough to reproduce. Include imports if they matter.
      render: python
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is this code fine?
      description: What makes it safe or intentional? This tells us what the rule should look for.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: slopguard version
      description: Output of `slopguard --version`
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The finding as slopguard printed it.
      render: text
