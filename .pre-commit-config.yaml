# For contributors: `pip install pre-commit && pre-commit install`
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^benchmarks/corpus/
      - id: trailing-whitespace
        exclude: ^(benchmarks/corpus/|docs/.*\.md$)
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src|tests|benchmarks/(compare|realworld)\.py)
  - repo: local
    hooks:
      - id: docs-up-to-date
        name: generated docs are current
        entry: python -m slopguard.docgen --check
        language: system
        pass_filenames: false
        files: ^(src/slopguard/(cli|docgen|rules/.*)\.py|docs/(cli|rules)\.md)$
