[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slopguard"
version = "0.1.0"
description = "Verify AI-generated code: LLM-app security, hallucinated packages, stubs and spec drift."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["security", "static-analysis", "llm", "ai-generated-code", "sarif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
slopguard = "slopguard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/slopguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/slopguard/cli.py" = ["B008"]

[tool.slopguard.scan]
exclude = ["tests/**", "benchmarks/corpus/**"]
